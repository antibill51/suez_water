# ==============================================================================
# Carte Lovelace - Qualité de l'eau & Étiquette minérale (Suez Water)
# Remplacez "YOUR_COUNTER_ID" par votre identifiant de compteur (ex: 3034956469).
# ==============================================================================
type: markdown
title: "Qualité de l'eau"
content: >
  ### 🚰 Qualité de l'Eau ({{ state_attr('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_statut_global', 'nom_commune') | title }})

  #### 🩺 Contrôles Sanitaires & Microbiologiques
  <table width="100%">
    <tr>
      <th align="left">Paramètre</th>
      <th align="center">Valeur</th>
      <th align="center">Norme / Seuil</th>
      <th align="center">État</th>
    </tr>
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_temperature') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🌡️ Température</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_temperature') }} °C</b></td>
      <td align="center">&lt; 25 °C</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_temperature')|float(100) < 25 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_ph') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🧪 pH</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_ph') }}</b></td>
      <td align="center">6.5 - 9.0</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_ph')|float(0) >= 6.5 and states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_ph')|float(0) <= 9 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_nitrates') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>☣️ Nitrates</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_nitrates') }} mg/L</b></td>
      <td align="center">≤ 50 mg/L</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_nitrates')|float(100) <= 50 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_e_coli') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🦠 E. Coli</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_e_coli') }} /100mL</b></td>
      <td align="center">0</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_e_coli')|float(-1) == 0 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_durete') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🪨 Dureté (Calcaire)</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_durete') }} °f</b></td>
      <td align="center"><i>indicatif (20-30 °f)</i></td>
      <td align="center">⚪</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlore_libre') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>💧 Chlore Libre</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlore_libre') }} mg/L</b></td>
      <td align="center"><i>indicatif</i></td>
      <td align="center">⚪</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlore_total') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>💧 Chlore Total</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlore_total') }} mg/L</b></td>
      <td align="center"><i>indicatif</i></td>
      <td align="center">⚪</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_pesticides') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🌱 Pesticides (12 mois)</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_pesticides') }} µg/L</b></td>
      <td align="center">≤ 0.5 µg/L</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_pesticides')|float(10) <= 0.5 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
  </table>

  #### 🏷️ Composition Minérale (L'étiquette de l'eau)
  <table width="100%">
    <tr>
      <th align="left">Minéral</th>
      <th align="center">Teneur</th>
      <th align="center">Rôle / Repère</th>
      <th align="center">État</th>
    </tr>
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_calcium') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🦴 Calcium (Ca)</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_calcium') }} mg/L</b></td>
      <td align="center">Solidité osseuse (repère 60 - 120)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_calcium')|float(0) >= 60 and states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_calcium')|float(0) <= 140 %}🟢{% else %}⚪{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_magnesium') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>⚡ Magnésium (Mg)</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_magnesium') }} mg/L</b></td>
      <td align="center">Énergie & muscles (repère &lt; 50)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_magnesium')|float(100) <= 50 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_sodium') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🧂 Sodium (Na)</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_sodium') }} mg/L</b></td>
      <td align="center">Pauvre en sodium (seuil &lt; 200)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_sodium')|float(500) <= 200 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_potassium') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🌿 Potassium (K)</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_potassium') }} mg/L</b></td>
      <td align="center">Équilibre hydrique (repère ≤ 12)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_potassium')|float(50) <= 12 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_bicarbonates') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🫧 Bicarbonates</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_bicarbonates') }} mg/L</b></td>
      <td align="center">Effet tampon & digestion (repère 100 - 400)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_bicarbonates')|float(0) >= 100 and states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_bicarbonates')|float(0) <= 400 %}🟢{% else %}⚪{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_fluor') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🦷 Fluor</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_fluor') }} mg/L</b></td>
      <td align="center">Émail dentaire (seuil ≤ 1.5)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_fluor')|float(10) <= 1.5 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlorures') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>🧪 Chlorures</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlorures') }} mg/L</b></td>
      <td align="center">Seuil ≤ 250 mg/L</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_chlorures')|float(500) <= 250 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_sulfates') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>⚗️ Sulfates</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_sulfates') }} mg/L</b></td>
      <td align="center">Seuil ≤ 250 mg/L</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_sulfates')|float(500) <= 250 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
    {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_conductivite') not in ['unknown', 'unavailable'] %}
    <tr>
      <td>⚡ Conductivité</td>
      <td align="center"><b>{{ states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_conductivite') }} µS/cm</b></td>
      <td align="center">Minéralisation moyenne (200 - 1100)</td>
      <td align="center">{% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_conductivite')|float(0) >= 200 and states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_conductivite')|float(0) <= 1100 %}🟢{% else %}🔴{% endif %}</td>
    </tr>
    {% endif %}
  </table>

  <br>
  {% set date_prelevement = state_attr('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_statut_global', 'date_prelevement') %}
  **📅 Dernier prélèvement :** {{ as_timestamp(date_prelevement) | timestamp_custom('%d/%m/%Y') if date_prelevement else 'Inconnue' }}  
  **📝 Bilan ARS :** {% if states('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_statut_global') == 'Conforme' %}🟢 **Conforme aux limites et références de qualité**{% else %}🔴 **Anomalie :** _{{ state_attr('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_statut_global', 'conclusion_conformite_prelevement') }}_{% endif %}  
  {% set quality_url = state_attr('sensor.suez_water_YOUR_COUNTER_ID_qualite_de_l_eau_statut_global', 'url_qualite') %}
  {% if quality_url %}
  🔗 [Consulter la fiche officielle sur Tout sur mon eau]({{ quality_url }})
  {% endif %}
